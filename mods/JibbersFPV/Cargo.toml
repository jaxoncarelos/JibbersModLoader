[package]
name = "jibbers-fpv"
version = "0.1.0"
edition = "2021"
description = "A playable FPV drone camera for Jibbers Playtest, built on the game's drone view"
publish = false

[lib]
name = "jibbers_fpv"
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
jibbers-mod-sdk = { path = "../../sdk/crates/jibbers-mod-sdk" }
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_XboxController", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "unwind"
