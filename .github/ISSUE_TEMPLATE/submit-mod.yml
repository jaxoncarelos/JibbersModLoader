name: Submit a mod
description: Add your C# mod to the Jibbers mod catalog, or update one you submitted before.
title: "Submit mod: "
labels: [mod-submission]
body:
  - type: markdown
    attributes:
      value: |
        A bot checks your source, copies it into `mods/cs/<Folder>` and opens a pull request for review.
        Once it's merged, players can install your mod from **Options > Mods**. Every public mod lives in this
        repository, so players only ever run code that was reviewed here.

        **Before you submit:** build your mod from the SDK template (`sdk/dotnet/template`), keep it to plain C#
        source (no DLLs, NuGet packages or build scripts), and add a `<Folder>.Tests` project if you can. The bot
        writes a basic one if you don't. See the [guide](https://github.com/jaxoncarelos/JibbersModLoader/blob/master/docs/guides/csharp-authoring.md).
  - type: input
    id: name
    attributes:
      label: Mod name
      description: What players see in the catalog, up to 40 characters.
      placeholder: Night Lights
    validations:
      required: true
  - type: input
    id: folder
    attributes:
      label: Folder
      description: The project's folder name under `mods/cs`, in PascalCase (letters and digits). The DLL gets the same name.
      placeholder: NightLights
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: One or two sentences for the catalog, up to 300 characters.
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Source repository
      description: A public GitHub repository with your mod. Leave empty if you attach a zip below.
      placeholder: https://github.com/you/night-lights
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The full 40-character commit hash to submit. Exactly this commit is reviewed and shipped.
      placeholder: 3f2a9c1e5b7d...
  - type: input
    id: path
    attributes:
      label: Path in the repository
      description: The folder holding your mod's .csproj (and its .Tests project beside it), if not the repository root.
      placeholder: src
  - type: textarea
    id: zip
    attributes:
      label: Source zip
      description: No repository? Drag a .zip of your mod's source folder into this box instead.
  - type: checkboxes
    id: update
    attributes:
      label: Update
      options:
        - label: This updates a mod already in the catalog (only its authors can update it).
  - type: checkboxes
    id: license
    attributes:
      label: License
      options:
        - label: I wrote this mod (or have the right to submit it) and release it under GPL-3.0-only, like the rest of this repository.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes for reviewers
      description: Anything worth knowing, such as what changed in an update or why the mod needs a native call.
