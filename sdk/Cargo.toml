[workspace]
resolver = "2"
members = [
    "crates/jibbers-mod-sdk",
    "crates/jibbers-sdk-runtime",
    "crates/jibbers-sdk-publish",
    "crates/jibbers-sdk-symbols",
    "crates/jibbers-sdk-devtools",
    "crates/jibbers-dotnet-bridge",
]

[workspace.package]
version = "0.1.2"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

# retour 0.3.1 with a fix: RIP-relative instructions followed by an immediate (such as the
# `cmp dword ptr [rip+X], 0` that opens SteamAPI_ManualDispatch_GetNextCallback) were relocated
# into the trampoline with the displacement written over the wrong bytes, crashing the game.
[patch.crates-io]
retour = { path = "third_party/retour" }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "unwind"
