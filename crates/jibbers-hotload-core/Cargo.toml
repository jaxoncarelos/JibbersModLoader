[package]
name = "jibbers-hotload-core"
version = "0.1.2"
license = "GPL-3.0-only"
edition = "2021"
description = "Game logic of the Jibbers hotload mod; loaded (and reloadable) by the version.dll loader"

[lib]
name = "jibbers_hotload_core"
crate-type = ["cdylib"]

[features]
# Atmosphere-only build for players: dispatch() accepts only the "atmo" command.
atmosphere-only = []
# Reshred-only build: answers only "reshred" and the plugin protocol.
reshred-only = []

[dependencies]
jibbers-distribution = { path = "../jibbers-distribution" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
